[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neucobench"
version = "1.1.0"
description = "NeuCo-Bench benchmark suite for evaluating compressed embeddings on Earth observation tasks."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Isabelle Wittmann" },
    { name = "Rikard Vinge" },
    { name = "Conrad M Albrecht" },
]

dynamic = ["dependencies"]

[project.scripts]
neuco-bench = "main:main"

[tool.setuptools]
package-dir = { "" = "benchmark" }
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["benchmark"]
include = ["data*", "evaluation*"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
